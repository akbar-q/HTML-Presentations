name: Deploy EEE4015 Course Library

on:
  push:
    branches: [main, master]
    paths:
      - 'EEE4015/week-01/**'
      - 'EEE4015/week-02/**'
      - 'EEE4015/week-03/**'
      - 'EEE4015/week-04/**'
      - 'EEE4015/week-05/**'
      - 'EEE4015/week-06/**'
      - 'index.html'
      - '404.html'
      - 'assets/eee4015-hub.css'
      - '.github/workflows/deploy-eee4015-week-01.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            EEE4015/week-01/package-lock.json
            EEE4015/week-02/package-lock.json
            EEE4015/week-03/package-lock.json
            EEE4015/week-04/package-lock.json
            EEE4015/week-05/package-lock.json
            EEE4015/week-06/package-lock.json
      - name: Install dependencies
        working-directory: EEE4015/week-01
        run: npm ci
      - name: Build lesson
        working-directory: EEE4015/week-01
        run: npm run build
      - name: Install Week 2 dependencies
        working-directory: EEE4015/week-02
        run: npm ci
      - name: Build Week 2 lesson
        working-directory: EEE4015/week-02
        run: npm run build
      - name: Install Week 3 dependencies
        working-directory: EEE4015/week-03
        run: npm ci
      - name: Build Week 3 lesson
        working-directory: EEE4015/week-03
        run: npm run build
      - name: Install Week 4 dependencies
        working-directory: EEE4015/week-04
        run: npm ci
      - name: Build Week 4 lesson
        working-directory: EEE4015/week-04
        run: npm run build
      - name: Install Week 5 dependencies
        working-directory: EEE4015/week-05
        run: npm ci
      - name: Build Week 5 lesson
        working-directory: EEE4015/week-05
        run: npm run build
      - name: Install Week 6 dependencies
        working-directory: EEE4015/week-06
        run: npm ci
      - name: Build Week 6 lesson
        working-directory: EEE4015/week-06
        run: npm run build
      - name: Assemble Pages site
        run: |
          mkdir -p _site/assets _site/EEE4015/week-01 _site/EEE4015/week-02 _site/EEE4015/week-03 _site/EEE4015/week-04 _site/EEE4015/week-05 _site/EEE4015/week-06
          cp index.html 404.html _site/
          cp assets/eee4015-hub.css _site/assets/
          cp -R EEE4015/week-01/dist/. _site/EEE4015/week-01/
          cp -R EEE4015/week-02/dist/. _site/EEE4015/week-02/
          cp -R EEE4015/week-03/dist/. _site/EEE4015/week-03/
          cp -R EEE4015/week-04/dist/. _site/EEE4015/week-04/
          cp -R EEE4015/week-05/dist/. _site/EEE4015/week-05/
          cp -R EEE4015/week-06/dist/. _site/EEE4015/week-06/
          printf 'edu.akbarq.com\n' > _site/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4