name: Deploy EEE4015 Week 1

on:
  push:
    branches: [main, master]
    paths:
      - 'EEE4015/week-01/**'
      - '.github/workflows/deploy-eee4015-week-01.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EEE4015/week-01/package-lock.json
      - name: Install dependencies
        working-directory: EEE4015/week-01
        run: npm ci
      - name: Build lesson
        working-directory: EEE4015/week-01
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: EEE4015/week-01/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4